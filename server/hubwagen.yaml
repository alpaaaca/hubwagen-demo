# The server machine: state in .hubwagen/ here, data versions in the bucket.
#   ./demo server     (or: cd server && hubwagen server --config hubwagen.yaml)
#
# No workers: section, so `hubwagen server` starts none: the workers run
# from ../elsewhere/revenue, as if on another machine, and reach the data
# through URLs this server hands them.
#
# ${NAME} values come from the environment (./demo reads .env); a
# :-default applies when NAME is unset or empty.
apiVersion: hubwagen.dev/v1alpha1
kind: Config

data_dir: .hubwagen
server:
  listen: ${HUBWAGEN_LISTEN:-127.0.0.1:7171}

# Without HUBWAGEN_BUCKET, data versions go to .hubwagen/bucket. Credentials
# come from the usual AWS variables (AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY), never this file.
bucket:
  url: ${HUBWAGEN_BUCKET:-}                # s3://bucket[/prefix]
  endpoint: ${HUBWAGEN_S3_ENDPOINT:-}      # S3-compatible stores (MinIO, R2); empty for AWS
  region: ${HUBWAGEN_S3_REGION:-}          # empty: asked of the store
