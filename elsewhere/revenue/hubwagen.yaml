# The worker machine: the workers for this project, against the server.
#   ./demo workers    (or: hubwagen workers --config hubwagen.yaml)
#
# They need no bucket credentials: the server hands them URLs for the
# data. ${NAME} values come from the environment (./demo reads .env).
apiVersion: hubwagen.dev/v1alpha1
kind: Config

server:
  listen: ${HUBWAGEN_LISTEN:-127.0.0.1:7171}   # the server the workers connect to

workers:
  - name: py
    replicas: ${HUBWAGEN_WORKERS:-3}
    command: [python3, -m, hubwagen.worker, --lifts, "2"]   # modules: pyproject.toml
    env:
      PYTHONPATH: ${HUBWAGEN_SDK:-}   # hubwagen's Python SDK; empty if it is installed
